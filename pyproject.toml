[project]
name = "be-project-teamd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tuski0", email = "tuski0@naver.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
be-project-teamd = "be_project_teamd:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
# 파일을 직접 지정해서 실행해도 exclude 설정을 적용
force-exclude = true

[tool.ruff.lint.flake8-bugbear]
# FastAPI의 Depends/Query 등은 기본값 자리에서 호출하는 게 정상 사용법 → B008 예외
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
# 회원 domain은 섹션 주석("""...""") 바로 아래 빈 줄 없이 쓰는 스타일 유지 → ruff format 제외 (ruff check는 그대로 적용)
exclude = ["src/users/domain/*.py"]
